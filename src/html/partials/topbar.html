    <header class="topbar d-flex align-items-center gap-3 px-4 py-3 flex-shrink-0">
      <div class="d-flex align-items-center gap-3">
        <span class="fw-bold" style="font-size:16px;color:#1a2235">Support Dashboard</span>
        <!-- Client identifier -->
        <div class="d-flex align-items-center gap-2 px-3 py-1 rounded-3" style="background:#eff4ff;border:1px solid #c7d5f8;">
        <svg width="34" height="34" viewBox="0 0 37 53.8" xmlns="http://www.w3.org/2000/svg" style="display:block;">
          <path fill="#141d22" d="M28.7,0c-4,0-6.1,7.7-14.8,11.9C10.7,13.4,0,15.9,0,19.4l0,0c0,4.9,5.2,2.5,8.2,2.5c11.4,0,11.6,7.1,1.3,11c-3.8,1.5-8.3,2.3-8.3,7.2c0,7.5,13.7,2.1,20.9,8.9c2.4,2.3,1.7,4.8,8.4,4.8c5.8,0,8.8-7.7,4.6-10.8c-3.4-2.6-6.3-0.9-11.6-0.9c-3,0-9.3-1.9-9.3-5.6c0-3.9,4.7-6.1,8.1-7c3.5-1,6.5-0.3,6.5-5c0-3.7-6.1-3-10-3.1c-3.1-0.1-9.1-1.7-9.7-3.4c-0.7-2.5,9.6-5.9,12.5-6.8c4.3-1.4,5.3-1,8.2-1.6C31,9.3,32.2,8.8,33,7.9c1.5-1.8,1.8-4.5-0.1-6.4C31.6,0.1,30.4,0,28.7,0"/>
        </svg>
          <span class="fw-semibold" style="font-size:12.5px;color:#3b7cf4" id="clientIdentifier">@@clientIdentifier</span>
          <span class="text-muted" style="font-size:11px" id="clientUser">· @@clientUser</span>
        </div>
      </div>
      <div class="search-wrap ms-2">
        <i class="bi bi-search"></i>
        <input class="search-input" id="searchInput" type="text" placeholder="Search tickets..."/>
      </div>
      <div class="d-flex gap-2 ms-auto align-items-center">
        <!-- Create Ticket button -->
        <button class="btn btn-primary btn-sm d-flex align-items-center gap-1 rounded-2 fw-semibold px-3"
          data-bs-toggle="modal" data-bs-target="#createTicketModal" style="font-size:13px">
          <i class="bi bi-plus-lg"></i> Create Ticket
        </button>
        <!-- Bell in topbar as dropdown -->
        <div class="dropdown">
          <button class="btn-icon-top" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            <i class="bi bi-bell"></i>
            <span class="notif-dot" id="notifDot"></span>
          </button>
          <div class="dropdown-menu dropdown-menu-end p-0 shadow rounded-3 notif-dropdown" style="border:1px solid #e4e9f2;">
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
              <span class="fw-bold" style="font-size:13px">Notifications</span>
              <div class="d-flex gap-2">
                <button class="btn btn-link btn-sm p-0 text-decoration-none" style="font-size:12px;color:#3b7cf4" onclick="markAllRead()">Mark all read</button>
                <button class="btn btn-link btn-sm p-0 text-decoration-none" style="font-size:12px;color:#d11a2a" onclick="deleteAllNotifs()">Delete all</button>
              </div>
            </div>
            <div id="notifList"></div>
          </div>
        </div>
        <button class="btn-icon-top"><i class="bi bi-gear"></i></button>
      </div>
    </header>
