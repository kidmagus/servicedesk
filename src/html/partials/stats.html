<div class="row g-3 flex-shrink-0">
        <div class="col-3">
          <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body d-flex justify-content-between align-items-start p-3">
              <div>
                <p class="text-muted mb-2 fw-medium" style="font-size:11.5px">Total Tickets</p>
                <div class="stat-value text-dark" id="statTotal">0</div>
                <p class="text-muted mt-1 mb-0" style="font-size:11px">All time submitted</p>
              </div>
              <div class="stat-icon" style="background:#eff4ff;color:#3b7cf4"><i class="bi bi-collection"></i></div>
            </div>
          </div>
        </div>
        <div class="col-3">
          <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body d-flex justify-content-between align-items-start p-3">
              <div>
                <p class="text-muted mb-2 fw-medium" style="font-size:11.5px">Open</p>
                <div class="stat-value" style="color:#1d4ed8" id="statOpen">0</div>
                <p class="text-muted mt-1 mb-0" style="font-size:11px">Awaiting response</p>
              </div>
              <div class="stat-icon" style="background:#dbeafe;color:#1d4ed8"><i class="bi bi-circle-fill" style="font-size:11px"></i></div>
            </div>
          </div>
        </div>
        <div class="col-3">
          <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body d-flex justify-content-between align-items-start p-3">
              <div>
                <p class="text-muted mb-2 fw-medium" style="font-size:11.5px">In Progress</p>
                <div class="stat-value" style="color:#b45309" id="statProgress">0</div>
                <p class="text-muted mt-1 mb-0" style="font-size:11px">Being worked on</p>
              </div>
              <div class="stat-icon" style="background:#fef9c3;color:#92400e"><i class="bi bi-arrow-repeat"></i></div>
            </div>
          </div>
        </div>
        <div class="col-3">
          <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body d-flex justify-content-between align-items-start p-3">
              <div>
                <p class="text-muted mb-2 fw-medium" style="font-size:11.5px">Resolved</p>
                <div class="stat-value" style="color:#16a34a" id="statResolved">0</div>
                <p class="text-muted mt-1 mb-0" style="font-size:11px">Successfully closed</p>
              </div>
              <div class="stat-icon" style="background:#dcfce7;color:#166534"><i class="bi bi-check-circle"></i></div>
            </div>
          </div>
        </div>
</div>
