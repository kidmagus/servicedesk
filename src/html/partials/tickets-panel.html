 <div class="card border-0 shadow-sm rounded-3 tickets-panel flex-grow-1">
        <div class="card-header bg-white border-bottom d-flex align-items-center gap-2 py-3 px-4">
          <span class="fw-bold" style="font-size:14px;color:#1a2235">Support Tickets</span>
          <span class="badge bg-light text-secondary rounded-pill ms-1" id="ticketCountBadge" style="font-size:11px">0 found</span>
          <div class="d-flex gap-2 ms-auto align-items-center">
            <select class="filter-select" id="filterStatus">
              <option value="">All Statuses</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
            <select class="filter-select" id="filterPriority">
              <option value="">All Priorities</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>

        <div class="table-scroll">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th onclick="sortBy('id')">Ticket ID <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('title')">Title <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('status')">Status <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('priority')">Priority <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('category')">Category <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('reporter')">Reporter <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('manager')">Manager <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
                <th onclick="sortBy('created')">Created <i class="bi bi-chevron-expand ms-1" style="font-size:10px;opacity:.4"></i></th>
              </tr>
            </thead>
            <tbody id="ticketTableBody"></tbody>
          </table>
          <div class="d-none text-center py-5 text-muted" id="emptyState">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-25"></i>
            <p class="mb-0" style="font-size:13.5px">No tickets match your filters.</p>
          </div>
        </div>

        <div class="card-footer bg-white border-top d-flex align-items-center justify-content-between px-4 py-2">
          <div class="text-muted" style="font-size:12.5px">
            Showing <strong class="text-dark" id="pageFrom">1</strong>–<strong class="text-dark" id="pageTo">8</strong>
            of <strong class="text-dark" id="pageTotal">0</strong> tickets
          </div>
          <div class="d-flex gap-1" id="pageControls"></div>
        </div>
      </div>
